[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-visualizer"
version = "0.1.0"
description = "Visualizer plugin for simple Graph presentation"
requires-python = ">=3.10"
dependencies = ["graph-explorer-api"]

[tool.setuptools.packages.find]
where = ["src"]

